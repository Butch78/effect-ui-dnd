<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>effect-ui-dnd</title>
    <style>
      body { font: 16px system-ui, sans-serif; margin: 2rem; color: #1f2328; }
      .board { max-width: 28rem; }
      .pane { height: 260px; overflow-y: auto; border: 1px solid #d0d7de; border-radius: 8px; padding: .5rem; margin: 0 0 1rem; }
      .tasks { list-style: none; padding: 0; margin: 0; }
      .task { display: flex; gap: .75rem; align-items: center; padding: .6rem .75rem; margin: 0 0 .5rem; border: 1px solid #d0d7de; border-radius: 8px; background: #fff; user-select: none; }
      .grip { cursor: grab; touch-action: none; user-select: none; color: #656d76; padding: 0 .25rem; border-radius: 4px; }
      .grip:focus { outline: 2px solid #0969da; outline-offset: 2px; }
      .task[data-dragging][aria-pressed], .task:has(.grip[aria-pressed]) { border-color: #0969da; background: #ddf4ff; }
      .task[data-dnd-disabled] .grip { cursor: not-allowed; opacity: .3; }
      .task[data-dragging] { box-shadow: 0 8px 24px rgb(0 0 0 / .15); }
      .task[data-placement="before"] { box-shadow: 0 -3px 0 #0969da; }
      .task[data-placement="after"] { box-shadow: 0 3px 0 #0969da; }
      .bin { padding: 1.5rem; border: 2px dashed #d0d7de; border-radius: 8px; text-align: center; }
      .bin[data-over] { border-color: #cf222e; background: #ffebe9; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
